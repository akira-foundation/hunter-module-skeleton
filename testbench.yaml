laravel: "@testbench"

providers:
  - :VendorNamespace:\:StudlyModuleName:\:StudlyModuleName:ServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

workbench:
  start: /
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: true
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
  assets:
    - :module_slug:-module-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
